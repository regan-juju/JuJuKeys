name: App screenshots

# Push to the "screenshots" branch → phone-sized emulator photos of every screen, committed back to that branch.
on:
  push:
    branches: [ "screenshots" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Debug build (x86 too)
        run: gradle assembleDebug -PwithX86 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/app_shots.sh
      - name: Commit screenshots
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -f shots/ && git commit -m "Screenshots [skip ci]" && git push || true
