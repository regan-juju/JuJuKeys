name: Keyboard screenshots (Android 13 / 14 / 15)
# Manual only: builds a debug APK and photographs the keyboard on emulators.
on: workflow_dispatch
jobs:
  shots:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [33, 34, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Debug APK (with x86_64 for the emulator)
        run: gradle assembleDebug -PwithX86 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash ci/screenshot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.api }}
          path: shots/
