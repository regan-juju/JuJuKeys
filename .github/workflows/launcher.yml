name: Build JuJuLauncher APK

# Only the launcher/ folder, only on the launcher branch (the keyboard workflow is not touched).
on:
  push:
    branches: [ "launcher" ]
    paths: [ "launcher/**", ".github/workflows/launcher.yml" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Unit tests and release build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|AssertionError" build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
      - name: Sign with the key from GitHub Secrets (never printed)
        env:
          KS_B64: ${{ secrets.JUJU_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JUJU_KEYSTORE_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          [ -n "$KS_B64" ] || { echo "::error::No signing key in Secrets"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/k.jks"
          mkdir -p signed
          $BT/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/a.apk"
          KS_PASS="$KS_PASS" $BT/apksigner sign --ks "$RUNNER_TEMP/k.jks" --ks-key-alias jujukeys2 --ks-pass env:KS_PASS --key-pass env:KS_PASS --out signed/JuJuLauncher.apk "$RUNNER_TEMP/a.apk"
          rm -f "$RUNNER_TEMP/k.jks"
          $BT/apksigner verify --verbose signed/JuJuLauncher.apk | head -4
          $BT/aapt2 dump badging signed/JuJuLauncher.apk | grep -E "^(package|sdkVersion|targetSdkVersion|launchable)" | while IFS= read -r l; do echo "::notice::$l"; done
      - uses: actions/upload-artifact@v4
        with: { name: JuJuLauncher, path: launcher/signed/, retention-days: 14 }
