name: Build JuJuKeys APK

# main          → build, test on emulators, publish a release (needs the new signing key in Secrets)
# pending-update → the same build + tests, but nothing is published
on:
  push:
    branches: [ "main", "pending-update" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests and release build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|expected|Exception|Could not|AssertionError" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Unit test results
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1); fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1)
            echo "::notice title=unit test::$(basename "$f" .xml) $t $fl"
          done
          grep -h "DICT " app/build/test-results/testDebugUnitTest/*.xml | head -3 | while IFS= read -r l; do echo "::notice title=dictionary::$l"; done

      # Security: the old key was public in this repo (now removed; it comes from a Secret). The APK is signed
      # with KEY ROTATION to the new private key from GitHub Secrets. On main, a missing key
      # stops the release — it never falls back to the old public key.
      - name: Sign (key rotation) and make emulator test variants
        env:
          NEW_KS_B64: ${{ secrets.JUJU_KEYSTORE_B64 }}
          NEW_KS_PASS: ${{ secrets.JUJU_KEYSTORE_PASS }}
          OLD_KS_B64: ${{ secrets.JUJU_OLD_KEYSTORE_B64 }}
        run: bash ci/sign_and_variants.sh

      - name: APK contents
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt2 dump badging signed/app-release.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission)" | while IFS= read -r l; do echo "::notice::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: signed
          path: signed/
          retention-days: 7

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator tests (update, migration, signing, backup)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash ci/device_test.sh
            bash ci/perf_test.sh
      - name: Results
        if: always()
        run: cat results-${{ matrix.api }}.txt 2>/dev/null || true

  instrumented-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests on Android 13 emulator (Keystore encryption, migration, Keep, sensitive, backup rules)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash -c 'set -o pipefail; gradle connectedDebugAndroidTest -PwithX86 --console=plain 2>&1 | tee itest.log'
      - name: Instrumented results
        if: always()
        run: |
          for f in app/build/outputs/androidTest-results/connected/**/*.xml app/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$f" ] || continue
            grep -o '<testcase name="[^"]*"' "$f" | sed 's/<testcase name=//' | while IFS= read -r t; do echo "::notice title=instrumented::$t"; done
            grep -A3 "<failure" "$f" | head -20 | while IFS= read -r l; do echo "::error title=instrumented::$l"; done
          done
          grep -E "FAILED|tests completed|Tests on|BUILD" itest.log 2>/dev/null | head -10 | while IFS= read -r l; do echo "::notice::$l"; done

  release:
    if: github.ref == 'refs/heads/main'
    needs: [build, device-tests, instrumented-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: signed
      - name: Version name
        run: echo "VNAME=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)" >> $GITHUB_ENV
      - name: Real key only
        run: |
          if [ "$(cat signed/key-kind.txt)" != "real" ]; then echo "::error::Not signed with the real key — no release."; exit 1; fi
          cp signed/app-release.apk JuJuKeys-v${{ env.VNAME }}.apk
      - name: Publish to Releases (phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VNAME }}
          name: JuJuKeys v${{ env.VNAME }}
          body: "JuJuKeys কীবোর্ড — ফোনে APK ডাউনলোড করে ইনস্টল করুন।"
          files: JuJuKeys-v${{ env.VNAME }}.apk
          make_latest: true
