name: Build JuJuKeys APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|expected|Exception|Could not" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Verify APK (signature + manifest)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | head -12 | while IFS= read -r l; do echo "::notice::$l"; done
          $BT/aapt2 dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission)" | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk JuJuKeys-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JuJuKeys-apk
          path: JuJuKeys-v1.0.${{ github.run_number }}.apk

      - name: Publish to Releases (phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JuJuKeys v1.0.${{ github.run_number }}
          body: "JuJuKeys কীবোর্ড — ফোনে APK ডাউনলোড করে ইনস্টল করুন।"
          files: JuJuKeys-v1.0.${{ github.run_number }}.apk
          make_latest: true
