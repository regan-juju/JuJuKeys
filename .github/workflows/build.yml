name: Build JuJuKeys APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleRelease --console=plain 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|expected|Exception|Could not" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      # Security: the old key (keystore/jujukeys.jks) was public in this repo. If the new private
      # key is stored in GitHub Secrets, the APK is re-signed with KEY ROTATION: phones on
      # Android 9+ move to the new key without uninstalling, and after that they refuse any
      # "update" signed only with the old (public) key.
      - name: Sign with the new private key (key rotation)
        env:
          NEW_KS_B64: ${{ secrets.JUJU_KEYSTORE_B64 }}
          NEW_KS_PASS: ${{ secrets.JUJU_KEYSTORE_PASS }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -z "$NEW_KS_B64" ] || [ -z "$NEW_KS_PASS" ]; then
            echo "::warning::New signing key not set in GitHub Secrets (JUJU_KEYSTORE_B64 / JUJU_KEYSTORE_PASS) — APK signed with the OLD public key only."
            exit 0
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "$NEW_KS_B64" | base64 -d > "$RUNNER_TEMP/new.jks"
          $BT/apksigner rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks keystore/jujukeys.jks --ks-key-alias jujukeys --ks-pass pass:jujukeys --key-pass pass:jujukeys \
            --new-signer --ks "$RUNNER_TEMP/new.jks" --ks-key-alias jujukeys2 --ks-pass env:NEW_KS_PASS --key-pass env:NEW_KS_PASS
          $BT/apksigner sign \
            --ks keystore/jujukeys.jks --ks-key-alias jujukeys --ks-pass pass:jujukeys --key-pass pass:jujukeys \
            --next-signer --ks "$RUNNER_TEMP/new.jks" --ks-key-alias jujukeys2 --ks-pass env:NEW_KS_PASS --key-pass env:NEW_KS_PASS \
            --lineage "$RUNNER_TEMP/lineage.bin" --rotation-min-sdk-version 28 \
            --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          rm -f "$RUNNER_TEMP/new.jks"
          $BT/apksigner lineage --in "$APK" --print-certs | while IFS= read -r l; do echo "::notice::lineage: $l"; done

      - name: Verify APK (signature + manifest)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | head -12 | while IFS= read -r l; do echo "::notice::$l"; done
          $BT/aapt2 dump badging app/build/outputs/apk/release/app-release.apk | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|uses-permission)" | while IFS= read -r l; do echo "::notice::$l"; done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk JuJuKeys-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JuJuKeys-apk
          path: JuJuKeys-v1.0.${{ github.run_number }}.apk

      - name: Publish to Releases (phone download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: JuJuKeys v1.0.${{ github.run_number }}
          body: "JuJuKeys কীবোর্ড — ফোনে APK ডাউনলোড করে ইনস্টল করুন।"
          files: JuJuKeys-v1.0.${{ github.run_number }}.apk
          make_latest: true
